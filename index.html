<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Masuk Panel Admin - TanggapIn</title>
    <link rel="stylesheet" href="styles/admin.css" />
    <link rel="icon" type="image/x-icon" href="assets/images/icons/logo.webp" />
  </head>
  <body class="login-page">
    <main class="login-card">
      <div class="brand">
        <img src="assets/images/icons/logo.webp" alt="" />
        <span>TanggapIn</span>
      </div>
      <h1>Masuk Panel Admin</h1>
      <p class="muted">Khusus Ombudsman dan dinas terkait.</p>

      <form id="loginForm" novalidate>
        <label class="dlg-field">
          <span>Email</span>
          <input type="email" id="email" autocomplete="username" required />
        </label>
        <label class="dlg-field">
          <span>Kata sandi</span>
          <input type="password" id="password" autocomplete="current-password" required />
        </label>
        <p class="dlg-err" id="loginErr" role="alert"></p>
        <button type="submit" class="btn primary login-btn">Masuk</button>
      </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
    <script src="scripts/config.js"></script>
    <script src="scripts/auth.js"></script>
    <script src="scripts/login.js"></script>
  </body>
</html>
