<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel Ombudsman - TanggapIn</title>
    <link rel="stylesheet" href="styles/admin.css" /><link rel="icon" type="image/x-icon" href="assets/images/icons/logo.webp" />
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar" aria-label="Navigasi">
        <div class="header-left brand">
          <img src="assets/images/icons/logo.webp" alt="Logo" class="logo" />
          <div class="logo-title">
            <div class="header-title">Tanggap<span>In</span></div>
            <p class="header-subtitle">Sistem Pengaduan Publik Berbasis Agentic AI</p>
          </div>
        </div>
        <div class="nav-label">Daftar Dinas</div>
        <nav class="nav" id="dinasList" aria-label="Daftar dinas"></nav>
        <div class="side-foot">
          <button type="button" id="resetDemo">Reset data demo</button>
          <a href="index.html" id="logout">Keluar</a>
        </div>
      </aside>
      <div class="content">
        <div class="topbar">
          <span>Selamat datang, <strong>Ombudsman</strong></span>
          <span class="user"><span class="avatar">O</span>Ombudsman · Superadmin</span>
        </div>
        <main class="main">
          <h1 id="dinasTitle"></h1>
          <p class="lead" id="dinasSummary"></p>
          <div class="stats" id="stats"></div>
          <section class="panel" aria-live="polite">
            <div id="banner"></div>
            <div class="tools">
              <label class="search"><input type="" id="search" placeholder="Cari kode, isi, atau lokasi laporan" aria-label="Cari laporan" /></label>
            </div>
            <div class="filter" id="filter" role="group" aria-label="Filter status laporan"></div>
            <div class="toolbar" id="toolbar"></div>
            <div class="report-list" id="reportList"></div>
          </section>
        </main>
      </div>
    </div>
    <script src="scripts/admin-core.js"></script>
    <script src="scripts/admin-ui.js"></script>
    <script src="scripts/ombudsman.js"></script>
  </body>
</html>
